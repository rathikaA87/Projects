<script>

const VIEWER=true; /* true in the restricted user edition: no Edit / Delete / Admin */

   The data workbook lives in this GitHub repository. Change these if the repository / folder changes.
   isPublic: set true ONLY if the repository is public (then product photos load without a token). */
const GH={owner:"rathikaA87",repo:"Projects",branch:"main",
 dir:"Happy_Hatch_Trading_System/Happy_Hatch_Data",file:"Happy_Hatch_Trading_Inventory_Data.xlsx",isPublic:false};

/* ---------------- data (sample rows – replace by opening your workbook) ---------------- */

function latestPurchase(code){let best=null;S.PURCHASE.forEach(p=>{if(p["Product Code"]===code&&num(p.Quantity)>0&&(!best||String(p["Date of Purchase"])>=String(best["Date of Purchase"])))best=p});return best}
const landed=p=>(num(p.Quantity)*num(p["Unit Cost"])+num(p["Freight Charges"])+num(p["Other Charges"]))/num(p.Quantity);
function calc(sheet,r){
 const o={...r};
 if(sheet==="PRODUCTS"){o["In Stock"]=stock(r["Product Code"]);const lp=latestPurchase(r["Product Code"]);o["Onboard Price"]=lp?landed(lp):0;o["Net Price"]=o["Onboard Price"]*(1+num(r["Profitability Percentage"]));o["Revenue"]=o["Net Price"]-o["Onboard Price"]}
 if(sheet==="SALES"){
  const tx=find("TAX","Tax Code",r["Tax Code"]);["GST (%)","CGST (%)","SGST (%)","IGST (%)"].forEach(k=>{o[k]=tx?num(tx[k]):0});
  const sub=S.SALES_ITEMS.filter(x=>x["Order Number"]===r["Order Number"]).reduce((a,x)=>a+num(x.MRP)*num(x.Quantity),0);
  o["Sub Total"]=sub;o["Tax Amount"]=sub*(o["GST (%)"]+o["CGST (%)"]+o["SGST (%)"]+o["IGST (%)"]);o["Total Amount"]=sub+o["Tax Amount"];o["Invoice No."]="INV-"+r["Order Number"]}
 if(sheet==="SALES_ITEMS"){const p=find("PRODUCTS","Product Code",r["Product Code"]),hd=find("SALES","Order Number",r["Order Number"]);o["Date of Sale"]=hd?hd["Date of Sale"]:"";o["Product Name"]=p?p["Product Name"]:"";o["Product price"]=p?calc("PRODUCTS",p)["Net Price"]:0;o["Net Amount"]=num(r.MRP)*num(r.Quantity)}
 if(sheet==="PURCHASE"){const p=find("PRODUCTS","Product Code",r["Product Code"]),q=num(r.Quantity),has=v=>v!==""&&v!==undefined&&v!==null;
  const tup=has(r["Total Unit Price"])?num(r["Total Unit Price"]):q*num(r["Unit Cost"]),uc=has(r["Unit Cost"])?num(r["Unit Cost"]):(q>0?tup/q:0);
  o["Product Name"]=p?p["Product Name"]:"";{const sp=find("SHIPPER","Shipper Number",r["Shipper Number"]);if(sp){o["Shipper Name"]=sp["Shipper Name"];o["Shipper Contact"]=sp.Phone||sp["Contact Person"]||"";o["Shipper Email"]=sp.Email||""}}o["Unit Cost"]=uc;o["Total Unit Price"]=tup;o["Total Cost"]=tup+num(r["Freight Charges"])+num(r["Other Charges"]);o["Onboard Price/Unit"]=q>0?o["Total Cost"]/q:0}
 customCalc(sheet,o);

const LOGO=()=>`<img src="${LOGO_URI}" alt="Happy Hatch logo" onload="this.parentNode.classList.add('has')">`;
const photoSrc=p=>/^(data:|https?:|file:|\/)/.test(p)?p:(ghPhotoUrls[p]||(GH_ON&&GH.isPublic?"https://raw.githubusercontent.com/"+GH.owner+"/"+GH.repo+"/"+ghEnc(GH.branch)+"/"+ghEnc(GH.dir+"/"+p):"Happy_Hatch_Data/"+p));

function invoiceHTML(order){
 const f0=find("SALES","Order Number",order);if(!f0)return"";const f=calc("SALES",f0),lines=S.SALES_ITEMS.filter(x=>x["Order Number"]===order).map(x=>calc("SALES_ITEMS",x)),c=find("CUSTOMERS","Customer Number",f["Customer Number"])||{},sub=lines.reduce((a,l)=>a+l["Net Amount"],0);
 const tx=[["GST","GST (%)"],["CGST","CGST (%)"],["SGST","SGST (%)"],["IGST","IGST (%)"]].map(([l,k])=>({l,p:num(f[k]),a:sub*num(f[k])})),tot=sub+tx.reduce((a,t)=>a+t.a,0);
 return `<div class="inv"><div class="ilogo">${LOGO()}</div><h2 style="margin-top:0;font-size:22px">Sales Invoice</h2>
 <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><b>${esc(inv.seller)}</b></div><div>Invoice no. <b>INV-${esc(order)}</b><br>Date: ${dfmt(f["Date of Sale"])}<br>Customer no.: ${esc(f["Customer Number"])}</div></div>
 <p><small style="color:var(--mut)">Bill to</small><br><b>${esc(c["Customer Name"])}</b><br>${esc(c.Address)}<br>${esc(c.City)}<br>${c.Phone?"Phone: "+esc(c.Phone):""}</p>
 <table><thead><tr><th>#</th><th>Code</th><th>Product</th><th class="n">Qty</th><th class="n">MRP</th><th class="n">Amount</th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l["Product Code"])}</td><td>${esc(l["Product Name"])}${l.Colour?` – ${esc(l.Colour)}`:""}</td><td class="n">${l.Quantity} ${esc(l.Unit||"")}</td><td class="n">${inr(l.MRP)}</td><td class="n">${inr(l["Net Amount"])}</td></tr>`).join("")}</tbody></table>
 <table style="width:auto;margin:12px 0 0 auto;min-width:300px"><tbody><tr><td><b>Subtotal</b></td><td class="n">${inr(sub)}</td></tr>${tx.map(t=>`<tr><td>${t.l} (${+(t.p*100).toFixed(2)}%)</td><td class="n">${inr(t.a)}</td></tr>`).join("")}<tr><td><b style="font-size:16px">TOTAL</b></td><td class="n"><b style="font-size:16px">${inr(tot)}</b></td></tr></tbody></table>
 <p style="font-size:12px;color:var(--mut)">Each tax amount = rate × Subtotal; rates come from the order's Tax Code. Confirm rates and invoice format with Finance and review before sharing with the customer.</p></div>`}
function printInvoices(list){
 if(!list.length){toast("No sales entries to print");return}
 $("#pall").innerHTML=list.map(o=>`<div class="pg">${invoiceHTML(o)}</div>`).join("");
 document.body.classList.add("pa");setTimeout(()=>{window.print()},50)}
window.addEventListener("afterprint",()=>{document.body.classList.remove("pa");$("#pall").innerHTML=""});

function renderNav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t==="ADMIN"?(isAuthed()?"🔓 Admin":"🔒 Admin"):LABEL[t]}</button>`).join("")}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};
function render(){renderNav();const m=$("#main");if(tab==="DASHBOARD")m.innerHTML=dashboard();else if(tab==="INVOICE")m.innerHTML=invoice();else if(tab==="ADMIN")m.innerHTML=isAuthed()?adminView():loginView();else m.innerHTML=sheetView(tab);bind();autoSaveCheck()}

function sheetView(sh){
 const sc=SCHEMA[sh],term=(q[sh]||"").toLowerCase(),df=sc.date?(dates["f"+sh]||""):"",dt=sc.date?(dates["t"+sh]||""):"";

function sha256(ascii){
 function rr(v,a){return(v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),result="",i,j,words=[],bl=ascii.length*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};
 for(var cand=2;pc<64;cand++){if(!comp[cand]){for(i=0;i<313;i+=cand)comp[i]=cand;hash[pc]=(mp(cand,.5)*mw)|0;k[pc++]=(mp(cand,1/3)*mw)|0}}
 ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return"";words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:"")+b.toString(16)}
 return result}

function checkPin(pin){
 if(Date.now()<lockUntil)return{ok:false,msg:`Too many attempts. Try again in ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`};
 if(/^\d{4,8}$/.test(pin)&&sha256(pinRec.salt+"|"+pin)===pinRec.hash){pinFails=0;return{ok:true}}
 pinFails++;if(pinFails>=5){lockUntil=Date.now()+30000;pinFails=0;return{ok:false,msg:"Too many wrong attempts. Locked for 30 seconds."}}
 return{ok:false,msg:`Incorrect PIN. ${5-pinFails} attempt${5-pinFails>1?"s":""} left.`}}

function parseExpr(f,sh,self){
 if(!f||!f.trim())return{err:"Enter an expression."};
 const strs=[],refs=[],cols=SCHEMA[sh].cols;let bad=null;
 let s=f.replace(/"([^"]*)"/g,(m,x)=>{strs.push(x);return` S${strs.length-1} `});
 s=s.replace(/\[([^\]]+)\]/g,(m,x)=>{if(x===self||!cols.some(c=>c.n===x))bad=x;refs.push(x);return` R${refs.length-1} `});
 if(bad!==null)return{err:`Unknown column [${bad}] – insert names with the column buttons so they match exactly.`};
 const left=s.replace(/\b[RS]\d+\b/g,"").replace(/\b(IF|ROUND|MIN|MAX|ABS|CONCAT|AND|OR|NOT)\b/g,"");
 if(!/^[\d\s.+\-*\/(),<>=!]*$/.test(left))return{err:"Not allowed in an expression: "+left.replace(/[\d\s.+\-*\/(),<>=!]/g,"").slice(0,20)};
 const js=s.replace(/<>/g,"!=").replace(/(?<![<>!=])=(?!=)/g,"==").replace(/\bR(\d+)\b/g,(m,i)=>`V(${JSON.stringify(refs[i])})`).replace(/\bS(\d+)\b/g,(m,i)=>JSON.stringify(strs[i]));
 try{new Function("V",...Object.keys(FNS),"return ("+js+")")}catch(e){return{err:"The expression has a syntax error (check brackets, commas and operators)."}}
 return{js,refs}}
function evalCol(c,sh,row){
 const p=c._p||(c._p=parseExpr(c.formula,sh,c.n));if(p.err)return"#ERR";
 const V=n=>{const cc=SCHEMA[sh].cols.find(x=>x.n===n),v=row[n];return cc&&isNumCol(cc)?num(v):(v===undefined||v===null?"":typeof v==="boolean"?(v?"Yes":"No"):v)};
 try{let r=new Function("V",...Object.keys(FNS),"return ("+p.js+")")(V,...Object.values(FNS));
  if(typeof r==="number"&&!isFinite(r))return"";
  const t=DT[c.dtype].t;if(t==="number"||t==="pct")r=r===""?"":num(r);
  else if(c.dtype==="bool"){if(typeof r==="boolean")r=r?"Yes":"No"}
  else if(typeof r==="boolean")r=r?"Yes":"No";
  return r}catch(e){return"#ERR"}}

   }catch(e){if(e&&e.name==="AbortError")return null;throw e}}
 }
 const o={types:XLSX_TYPES,multiple:false,mode:MODE,id:"hh-data"};if(dirHandle)o.startIn=dirHandle;
 const [h]=await showOpenFilePicker(o);return h}
function initSync(){
 lastSig=sigOf();
 if(VIEWONLY)setSync("View only – click Open workbook (view) to load the data file","warn");
 else if(CAN_FS)setSync("No Excel file connected – click Open workbook (opens "+DATA_DIR+"\\"+DATA_FILE+")","warn");
 else setSync("This browser cannot save into an opened file – use Chrome or Edge. Export Data downloads a copy.","warn")}
async function openWithHandle(forcePick){
 try{
  const h=await chooseFile(forcePick);if(!h)return;
  const f=await h.getFile(),wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
  if(!wb.SheetNames.includes("PRODUCTS")){alert("This does not look like a Happy Hatch data workbook (no PRODUCTS sheet).");return}
  if(isDirty()&&!confirm("Replace the entries currently in the page with the data in "+f.name+"?"))return;
  let bind=!VIEWONLY;
  if(bind&&(wb.SheetNames.includes("DASHBOARD")||wb.SheetNames.includes("INVOICE")))
   bind=confirm(`"${f.name}" is the formatted Excel template (dashboard, invoice, logo, formulas).\n\nOK = connect to it: the app would REWRITE it as a plain data workbook and that formatting would be lost.\nCancel = only load its data; changes will NOT be saved into it.\n\nTip: use ${DATA_FILE} for saving data.`);
  const n=applyWorkbook(wb);fh=null;fileName="";
  if(bind){if(await perm(h)){fh=h;fileName=f.name}else alert("Write permission was not given, so changes cannot be saved into this file.")}
  lastSig=sigOf();render();
  viewName=VIEWONLY?f.name:"";fileUi();
  closeGate();
  if(VIEWONLY||fh)setSync("","");else setSync(`Loaded ${n} records from ${f.name} · NOT connected – changes are not saved`,"bad");
 }catch(e){if(e&&e.name==="AbortError")return;alert("Could not open the file: "+(e.message||e))}}
function exportData(){const d=new Date().toISOString().slice(0,10),n="Happy_Hatch_Data_Export_"+d+".xlsx";XLSX.writeFile(buildWorkbook(),n);toast("Exported "+n+" (Downloads folder)")}
async function doSave(manual){
 if(!fh)return;
 if(saving){saveTimer=setTimeout(doSave,400);return}
 saving=true;const s=sigOf();setSync("Saving…","warn");
 try{
  const buf=XLSX.write(buildWorkbook(),{bookType:"xlsx",type:"array"});
  const w=await fh.createWritable();await w.write(buf);await w.close();
  lastSig=s;setSync(`Saved to ${fileName} at ${hhmm()}`,"ok");if(manual)toast("Saved to "+fileName);
  if(sigOf()!==s)autoSaveCheck();
 }catch(e){
  setSync("Not saved: "+(["NotReadableError","InvalidStateError","NoModificationAllowedError"].includes(e&&e.name)?"the file is open in Excel – close it and changes will save":(e&&e.message)||e),"bad");
  setTimeout(()=>{if(fh&&sigOf()!==lastSig)doSave()},5000)}
 saving=false}
function autoSaveCheck(){
 if(GH_ON)ghUi();
 if(ghConn){if(VIEWONLY)return;const d=isDirty();if(d)setSync("● Unsaved changes – click Save to GitHub (Ctrl+S)","warn");else if(!ghSaving&&/Unsaved/.test($("#sync").textContent))setSync("","");return}
 if(VIEWONLY)return;
 if(!fh){if(CAN_FS&&isDirty())setSync("⚠ NOT SAVED – no Excel file connected. Click Open workbook to connect your data file (Export Data downloads a copy).","bad");return}
 if(sigOf()===lastSig)return;
 setSync("Unsaved changes…","warn");clearTimeout(saveTimer);saveTimer=setTimeout(doSave,500)}
window.addEventListener("beforeunload",e=>{if(isDirty()){e.preventDefault();e.returnValue=""}});
$('#hlogo').innerHTML=LOGO();
if(VIEWONLY){document.title="Happy Hatch – View only";$('#hsub').textContent="View and search only";$('#exp').style.display="none";$('#imp').textContent="Open workbook (view)"}
else if(VIEWER){document.title="Happy Hatch – Data Entry (User)";$('#hsub').textContent="Trading & Inventory"}

/* ---------------- GitHub storage: load the data file from the repo, save = one commit ---------------- */
const GH_API="https://api.github.com/repos/"+GH.owner+"/"+GH.repo;
const ghTok=()=>{try{return localStorage.getItem("hh_gh_token")||""}catch(e){return ""}};
const ghUser=()=>{try{return localStorage.getItem("hh_gh_user")||""}catch(e){return ""}};
function ghExplain(st,msg){
 if(st===401)return "GitHub rejected the access token (wrong or expired). Open GitHub settings and paste a new token.";
 if(st===403)return /rate limit/i.test(msg)?"GitHub rate limit reached – add an access token in GitHub settings, or wait a few minutes.":"The token has no permission for this repository (it needs Contents: Read and write).";
 if(st===404)return "Not found on GitHub. If the repository is private, add an access token (GitHub settings). Also check the repository, branch and folder names.";
 return "GitHub error "+st+(msg?": "+msg:"")}
async function ghFetch(path,opt){
 opt=opt||{};const h=Object.assign({"Accept":"application/vnd.github+json"},opt.headers||{});
 const t=ghTok();if(t)h.Authorization="Bearer "+t;
 if(opt.body)h["Content-Type"]="application/json";
 let r;try{r=await fetch(path.indexOf("http")===0?path:GH_API+path,Object.assign({cache:"no-store"},opt,{headers:h}))}
 catch(e){const x=new Error("Cannot reach GitHub – check your internet connection.");x.status=0;throw x}
 if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}const x=new Error(ghExplain(r.status,m));x.status=r.status;x.gh=m;throw x}
 return r}
const ghJson=async(p,o)=>(await ghFetch(p,o)).json();
const ghB64=buf=>{const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const ghUnb64=b=>{const s=atob(b.replace(/\s/g,"")),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const ghContentsUrl=p=>"/contents/"+ghEnc(p)+"?ref="+encodeURIComponent(GH.branch);
const ghCounts=()=>{const o={};Object.keys(SCHEMA).forEach(k=>o[k]=(S[k]||[]).length);return o};
const ghPhotosPending=()=>(S.PRODUCTS||[]).filter(r=>r.__img&&/^data:/.test(r.__img)&&r["Photo File"]&&r.__imgPushed!==r.__img);

function ghUi(){
 if(!GH_ON)return;
 $("#ghload").style.display="";$("#ghset").style.display="";
 $("#ghload").textContent=ghConn?"Reload from GitHub":"Load from GitHub";
 const sv=$("#ghsave");sv.style.display=ghConn&&!VIEWONLY?"":"none";sv.disabled=ghSaving||!isDirty()}

async function ghGetFile(){
 const q=ghContentsUrl(GH.dir+"/"+GH.file),meta=await ghJson(q);
 let bytes;
 if(meta.content&&meta.encoding==="base64")bytes=ghUnb64(meta.content);
 else bytes=new Uint8Array(await (await ghFetch(q,{headers:{Accept:"application/vnd.github.raw+json"}})).arrayBuffer());
 return {bytes,sha:meta.sha}}

async function ghLoad(first){
 const ge=$("#gErr");if(ge)ge.textContent="";
 if(!first&&isDirty()&&!confirm("Discard your unsaved changes and load the latest data from GitHub?"))return;
 try{
  setSync("Loading from GitHub…","warn");
  const f=await ghGetFile(),wb=XLSX.read(f.bytes,{type:"array"});
  if(!wb.SheetNames.includes("PRODUCTS"))throw new Error("The file on GitHub is not a Happy Hatch data workbook (no PRODUCTS sheet).");
  const n=applyWorkbook(wb);
  fh=null;fileName="";ghConn=true;ghSha=f.sha;ghBase=ghCounts();
  lastSig=sigOf();S.PRODUCTS.forEach(r=>{delete r.__img;delete r.__imgPushed});
  render();fileUi();closeGate();ghUi();
  setSync(`Loaded ${n} records from GitHub (${GH.branch}) at ${hhmm()}`,"ok");
  ghLoadPhotos();
 }catch(e){
  setSync("Could not load from GitHub","bad");
  const g=$("#gate");
  if(g&&g.open&&ge)ge.textContent=e.message||String(e);else alert("Could not load from GitHub:\n"+(e.message||e));
  ghUi();
 }}

async function ghLoadPhotos(){
 if(GH.isPublic)return;
 try{
  const list=await ghJson(ghContentsUrl(GH.dir+"/Product_Photos"));if(!Array.isArray(list))return;
  const have=new Set(list.filter(x=>x.type==="file").map(x=>x.name));let any=false;
  for(const r of S.PRODUCTS){
   const p=String(r["Photo File"]||""),nm=p.split("/").pop();
   if(!nm||!have.has(nm)||ghPhotoUrls[p])continue;
   const res=await ghFetch(ghContentsUrl(GH.dir+"/"+p),{headers:{Accept:"application/vnd.github.raw+json"}});
   ghPhotoUrls[p]=URL.createObjectURL(await res.blob());any=true}
  if(any)render();
 }catch(e){}}

const csvCell=v=>{v=v==null?"":String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function ghCsv(sh){const cols=SCHEMA[sh].cols.filter(c=>!c.c);
 return [cols.map(c=>csvCell(c.n)).join(",")].concat((S[sh]||[]).map(r=>cols.map(c=>csvCell(r[c.n])).join(","))).join("\n")+"\n"}
function ghDefaultMsg(){
 const now=ghCounts(),parts=[];
 Object.keys(now).forEach(k=>{const d=now[k]-((ghBase&&ghBase[k])||0);if(d)parts.push(SCHEMA[k].label+" "+(d>0?"+":"")+d)});
 const who=ghUser();
 return "Update data"+(parts.length?": "+parts.join(", "):": edited records")+(who?" (by "+who+")":"")}

async function ghSave(){
 if(!GH_ON||!ghConn||VIEWONLY||ghSaving)return;
 if(!ghTok()){ghSettings("Saving to GitHub needs an access token (one-time per computer). Paste it below.");return}
 if(!isDirty()){toast("No changes to save");return}
 const msg=prompt("Describe this change (stored as the GitHub commit message):",ghDefaultMsg());
 if(msg===null)return;
 ghSaving=true;const sig=sigOf();setSync("Saving to GitHub…","warn");ghUi();
 let step="";
 try{
  step="check";
  const cur=await ghJson(ghContentsUrl(GH.dir+"/"+GH.file));
  if(cur.sha!==ghSha){const x=new Error("conflict");x.conflict=true;throw x}
  const bp=ghEnc(GH.branch);
  const ref=await ghJson("/git/ref/heads/"+bp),headSha=ref.object.sha;
  const head=await ghJson("/git/commits/"+headSha);
  const files=[{path:GH.dir+"/"+GH.file,b64:ghB64(XLSX.write(buildWorkbook(),{bookType:"xlsx",type:"array"}))}];
  Object.keys(SCHEMA).forEach(k=>files.push({path:GH.dir+"/Data_Snapshots_CSV/"+k+".csv",text:ghCsv(k)}));
  ghPhotosPending().forEach(r=>files.push({path:GH.dir+"/"+r["Photo File"],b64:r.__img.split(",")[1],rec:r}));
  const tree=[];
  for(const f of files){
   const b=await ghJson("/git/blobs",{method:"POST",body:JSON.stringify(f.b64!=null?{content:f.b64,encoding:"base64"}:{content:f.text,encoding:"utf-8"})});
   f.sha=b.sha;tree.push({path:f.path,mode:"100644",type:"blob",sha:b.sha})}
  const nt=await ghJson("/git/trees",{method:"POST",body:JSON.stringify({base_tree:head.tree.sha,tree})});
  const c=await ghJson("/git/commits",{method:"POST",body:JSON.stringify({message:(msg.trim()||ghDefaultMsg()),tree:nt.sha,parents:[headSha]})});
  step="ref";
  await ghFetch("/git/refs/heads/"+bp,{method:"PATCH",body:JSON.stringify({sha:c.sha,force:false})});
  ghSha=files[0].sha;ghBase=ghCounts();lastSig=sig;files.forEach(f=>{if(f.rec)f.rec.__imgPushed=f.rec.__img});
  ghSaving=false;
  setSync(`Saved to GitHub · commit ${c.sha.slice(0,7)} · ${hhmm()}`,"ok");toast("Saved to GitHub");
  if(sigOf()!==sig||ghPhotosPending().length)autoSaveCheck();else ghUi();
 }catch(e){
  ghSaving=false;
  if(e.conflict||(step==="ref"&&(e.status===422||e.status===409))){
   setSync("NOT SAVED – someone else saved newer data to GitHub first","bad");
   alert("Your changes were NOT saved.\n\nSomeone else saved a newer version to GitHub while you were working, and saving now would overwrite their work.\n\nKeep your work: click Export Data (downloads a copy), then click Reload from GitHub and re-enter your changes.");
  }else{setSync("NOT SAVED – "+(e.message||e),"bad");alert("Could not save to GitHub:\n"+(e.message||e))}
  ghUi();
 }}

/* ---- settings dialog (token + name) ---- */
function ghSettings(note,cls){
 $("#ghrepo").value=GH.owner+"/"+GH.repo+" · branch "+GH.branch+" · "+GH.dir;
 $("#ghtok").value="";$("#ghtok").placeholder=ghTok()?"Token saved on this computer – paste a new one to replace it":"github_pat_…";
 $("#ghname").value=ghUser();const n=$("#ghnote");n.textContent=note||"";n.className="note "+(cls||"");
 if(!$("#ghdlg").open)$("#ghdlg").showModal()}
function ghGate(){
 const g=$("#gGh"),t=$("#gTok"),o=$("#gOpen");
 if(!GH_ON){g.style.display="none";t.style.display="none";return}
 $("#gtxt").textContent="Loading the latest data from GitHub ("+GH.owner+"/"+GH.repo+", branch "+GH.branch+"). "+(VIEWONLY?"You can view and search; nothing is changed.":"Your changes are saved with Save to GitHub – one tracked commit each time.");
 g.onclick=()=>ghLoad(true);t.onclick=()=>ghSettings();
 o.className="link";o.textContent="Open a local Excel file instead"}
$("#ghsave").onclick=()=>ghSave();
$("#ghload").onclick=()=>ghLoad(!ghConn);
$("#ghset").onclick=()=>ghSettings();
$("#ghtokclose").onclick=()=>$("#ghdlg").close();
$("#ghtokdel").onclick=()=>{try{localStorage.removeItem("hh_gh_token")}catch(e){}ghSettings("Token removed from this computer.","ok")};
$("#ghtoksave").onclick=async()=>{
 const t=$("#ghtok").value.trim(),nm=$("#ghname").value.trim();
 try{localStorage.setItem("hh_gh_user",nm)}catch(e){}
 if(!t){ghSettings("Name saved.","ok");return}
 try{localStorage.setItem("hh_gh_token",t)}catch(e){}
 try{
  const r=await ghJson("");
  if(r.permissions&&r.permissions.push===false)ghSettings("Token accepted, but it is READ-ONLY – saving will not work. Create it with Contents: Read and write.","bad");
  else ghSettings("Token accepted for "+GH.owner+"/"+GH.repo+".","ok");
 }catch(e){try{localStorage.removeItem("hh_gh_token")}catch(x){}ghSettings(e.message,"bad")}
 ghUi()};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&GH_ON&&ghConn&&!VIEWONLY){e.preventDefault();ghSave()}});

function openGate(){
 const g=$("#gate");document.body.classList.add("gated");$("#glogo").innerHTML=LOGO();
 $("#gtxt").textContent=VIEWONLY?"Choose the Happy Hatch data file to view the records.":CAN_PICK?"Choose Happy_Hatch_Trading_Inventory_Data.xlsx (first time: choose the Happy_Hatch_Data folder). Your changes will be saved straight into that file.":"Choose Happy_Hatch_Trading_Inventory_Data.xlsx to load your data. (This browser cannot save into the file - use Chrome or Edge for that.)";
 $("#gOpen").textContent=VIEWONLY?"Open Excel file (view)":"Open Excel file";
 g.addEventListener("cancel",e=>e.preventDefault());
 $("#gOpen").onclick=()=>{if(CAN_PICK)openWithHandle(false);else $("#file").click()};
 $("#gSkip").onclick=closeGate;ghGate();
 g.showModal();$("#gOpen").focus()}
function closeGate(){const g=$("#gate");if(g&&g.open)g.close();document.body.classList.remove("gated")}
render();initSync();openGate();if(GH_ON)ghLoad(true);
</script></body></html>
